track: coding

rubric:
  - id: understanding
    name: Problem understanding
    description: Clarifies the input, output, constraints and edge cases before writing code.
    anchors:
      1: Starts coding straight away and misunderstands the problem.
      2: Understands the main case but misses important constraints or edge cases.
      3: Asks good clarifying questions and confirms the edge cases before coding.
      4: Spots tricky edge cases and constraints the interviewer did not mention.
  - id: approach
    name: Approach
    description: Finds a working approach, improves it toward the optimal one and justifies the data structures.
    anchors:
      1: No working approach, even with hints.
      2: Reaches a brute force solution, or the optimal one only after heavy hints.
      3: States a brute force, then reaches the optimal approach with little help.
      4: Goes straight to the optimal approach and clearly explains why it works.
  - id: correctness
    name: Correctness
    description: The code is correct, handles edge cases and is tested by walking through an example.
    anchors:
      1: Code does not work or is missing.
      2: Main idea is right but there are real bugs or missed edge cases.
      3: Correct code with at most small slips that they catch themselves.
      4: Clean, correct, idiomatic code, tested with an example and edge cases without being asked.
  - id: complexity
    name: Complexity analysis
    description: Gives correct time and space complexity and explains where it comes from.
    anchors:
      1: No analysis, or it is wrong.
      2: Partly right, or right but cannot explain why.
      3: Correct time and space complexity with a clear explanation.
      4: Correct analysis, and discusses trade-offs between approaches or the best possible bound.
  - id: communication
    name: Communication
    description: Thinks out loud, explains decisions and works well with hints.
    anchors:
      1: Silent or hard to follow. Ignores hints.
      2: Explains some steps but the interviewer has to pull information out.
      3: Explains the plan before coding and talks through decisions.
      4: Easy to follow throughout. Feels like working with a strong teammate.

level_bar:
  junior: Solves a medium problem with some hints. Code works, complexity mostly right.
  mid: Solves a medium problem with few hints, clean code, correct complexity, tests their own code.
  senior: Solves a medium problem quickly and cleanly, drives the conversation, discusses trade-offs and follow-up variants.
  staff: Same as senior, plus deep reasoning about trade-offs, scale and how the solution would hold up in production.

questions:
  - id: group-anagrams
    title: Group anagrams
    prompt: |
      Given a list of words, group the words that are anagrams of each other.
      Return the groups in any order.

      Example: ["eat", "tea", "tan", "ate", "nat", "bat"]
      Output:  [["eat", "tea", "ate"], ["tan", "nat"], ["bat"]]
    strong_signals:
      - Asks about character set (lowercase only?), empty strings and duplicates.
      - Uses a hash map keyed by a canonical form of the word (sorted letters or a letter count tuple).
      - Time O(n * k log k) with sorting, or O(n * k) with a count key, where k is word length.
      - Space O(n * k) for the map.
    follow_ups:
      - Can you avoid sorting each word? What would the key be?
      - What changes if the words can contain any Unicode character?
      - How would you do this if the list was too big to fit in memory?

  - id: merge-intervals
    title: Merge overlapping intervals
    prompt: |
      Given a list of intervals [start, end], merge all overlapping intervals
      and return the result.

      Example: [[1, 3], [2, 6], [8, 10], [15, 18]]
      Output:  [[1, 6], [8, 10], [15, 18]]
    strong_signals:
      - Asks whether touching intervals like [1, 4] and [4, 5] count as overlapping.
      - Sorts by start time, then merges in one pass by comparing with the last merged interval.
      - Time O(n log n) for the sort, space O(n) for the output.
      - Handles an empty list and a single interval.
    follow_ups:
      - What if the intervals arrive one at a time as a stream?
      - How would you insert one new interval into an already merged list?
      - Can you do it without extra space if the input can be changed?

  - id: lru-cache
    title: LRU cache
    prompt: |
      Design a cache with a fixed capacity that supports get(key) and put(key, value).
      When the cache is full, put removes the least recently used item.
      Both operations should run in O(1) time.
    strong_signals:
      - Asks what get returns for a missing key and whether put on an existing key counts as a use.
      - Combines a hash map (key to node) with a doubly linked list ordered by recent use.
      - Moves a node to the front on get and put, and removes from the back when full.
      - Both operations O(1) time, O(capacity) space.
    follow_ups:
      - Why a doubly linked list and not a singly linked one?
      - How would you make it safe to use from many threads?
      - How would you change it to evict the least frequently used item instead?

  - id: top-k-frequent
    title: Top k frequent elements
    prompt: |
      Given a list of integers and a number k, return the k most frequent numbers.

      Example: nums = [1, 1, 1, 2, 2, 3], k = 2
      Output:  [1, 2]
    strong_signals:
      - Asks how to break ties and whether k can be larger than the number of unique values.
      - Counts with a hash map, then uses a min heap of size k, or bucket sort by frequency.
      - Heap approach O(n log k) time, bucket sort O(n) time, both O(n) space.
      - Explains when the heap is better than sorting everything.
    follow_ups:
      - Can you do better than O(n log k)?
      - What if the numbers arrive as an endless stream?
      - What if the data is spread across many machines?

  - id: course-schedule
    title: Course schedule
    prompt: |
      There are n courses labelled 0 to n - 1. You are given a list of pairs [a, b]
      meaning you must take course b before course a.
      Return true if it is possible to finish all courses.

      Example: n = 2, prerequisites = [[1, 0]]  ->  true
      Example: n = 2, prerequisites = [[1, 0], [0, 1]]  ->  false
    strong_signals:
      - Recognises it as cycle detection in a directed graph.
      - Builds an adjacency list and uses Kahn's algorithm (in-degree and a queue) or DFS with three colours.
      - Time O(V + E), space O(V + E).
      - Handles courses with no prerequisites and duplicate pairs.
    follow_ups:
      - How would you return a valid order to take the courses?
      - Why does DFS need three states and not just visited or not visited?
      - What if the graph is too large for recursion?

  - id: longest-unique-substring
    title: Longest substring without repeating characters
    prompt: |
      Given a string, find the length of the longest substring that has no repeating characters.

      Example: "abcabcbb"  ->  3  ("abc")
      Example: "pwwkew"    ->  3  ("wke")
    strong_signals:
      - Asks about the character set and the empty string.
      - Uses a sliding window with a map from character to last seen index.
      - Moves the left edge past the previous copy of a repeated character, never backwards.
      - Time O(n), space O(min(n, alphabet size)).
    follow_ups:
      - Why must the left pointer never move backwards?
      - How would you return the substring itself, not only its length?
      - What changes if you may allow at most two repeats of any character?

  - id: valid-brackets
    title: Valid brackets
    levels: [junior, mid]
    prompt: |
      Given a string made of the characters ( ) [ ] { }, return true if every bracket
      is closed by the same kind of bracket, in the right order.

      Example: "([]{})"  ->  true
      Example: "([)]"    ->  false
    strong_signals:
      - Asks about the empty string and whether other characters can appear.
      - Uses a stack, pushing opening brackets and checking each closing bracket against the top.
      - Returns false when a closing bracket meets an empty stack, and when the stack is not empty at the end.
      - Time O(n), space O(n).
    follow_ups:
      - Can you return early on some inputs without reading the whole string?
      - If there is only one kind of bracket, can you do it in O(1) space?
      - How would you return the position of the first bracket that breaks the rule?

  - id: two-sum
    title: Two numbers that add up to a target
    levels: [junior, mid]
    prompt: |
      Given a list of integers and a target, return the indices of two different
      numbers that add up to the target. You may assume exactly one answer exists.

      Example: nums = [2, 7, 11, 15], target = 9
      Output:  [0, 1]
    strong_signals:
      - Asks about negative numbers, duplicates and whether the same element can be used twice.
      - Starts from checking every pair in O(n^2) and explains why that is slow.
      - Uses a hash map from value to index in one pass, looking up target minus the current number before storing it.
      - Time O(n), space O(n).
    follow_ups:
      - If the list is sorted, can you do it in O(1) extra space?
      - How would you return every pair that adds up to the target, without duplicates?
      - What changes if you need three numbers instead of two?

  - id: number-of-islands
    title: Number of islands
    prompt: |
      Given a grid of 1 (land) and 0 (water), count the islands. An island is land
      joined up, down, left or right. Everything outside the grid is water.

      Example:
        1 1 0 0
        1 0 0 1
        0 0 1 1
      Output: 2
    strong_signals:
      - Asks whether diagonal cells count as joined and whether the grid can be changed.
      - Scans every cell and starts a BFS or DFS from each unvisited land cell, counting how many it starts.
      - Marks a cell as visited when it is added, so no cell is processed twice.
      - Time O(rows * cols), space O(rows * cols) in the worst case for the queue, stack or visited set.
    follow_ups:
      - Recursive DFS can overflow the stack on a large grid. How would you avoid that?
      - Land is added one cell at a time. How would you keep the island count up to date after each one?
      - What if the grid is too big to fit in memory on one machine?

  - id: level-order
    title: Binary tree level by level
    levels: [junior, mid]
    prompt: |
      Given the root of a binary tree, return its values level by level,
      from left to right within each level.

      Example:
            3
           / \
          9   20
             /  \
            15   7
      Output: [[3], [9, 20], [15, 7]]
    strong_signals:
      - Asks about an empty tree.
      - Uses BFS with a queue and handles one level at a time by reading the queue's size before each level.
      - Adds children left before right so each level comes out in order.
      - Time O(n), space O(n) in the worst case for the queue.
    follow_ups:
      - Can you do it with DFS instead? How do you know which level a node belongs to?
      - How would you return the levels in zigzag order, left to right then right to left?
      - How would you return only the rightmost value on each level?

  - id: coin-change
    title: Fewest coins
    levels: [mid, senior, staff]
    prompt: |
      Given coin values and an amount, return the fewest coins that add up to the amount.
      You have as many of each coin as you like. Return -1 if the amount can't be made.

      Example: coins = [1, 2, 5], amount = 11  ->  3  (5 + 5 + 1)
      Example: coins = [2], amount = 3         ->  -1
    strong_signals:
      - Shows that always taking the biggest coin can fail, for example coins [1, 3, 4] and amount 6.
      - Defines the subproblem clearly as the fewest coins for every amount from 0 up to the target.
      - Builds a bottom-up table or memoised recursion, with the answer for 0 set to 0 and unreachable amounts marked.
      - Time O(amount * number of coins), space O(amount).
    follow_ups:
      - How would you return the coins used, not only how many?
      - How would you count the number of different ways to make the amount instead?
      - Would a BFS over amounts work here? How does it compare?

  - id: merge-k-sorted
    title: Merge k sorted lists
    levels: [mid, senior, staff]
    prompt: |
      Given k sorted lists of numbers, merge them into one sorted list.

      Example: [[1, 4, 5], [1, 3, 4], [2, 6]]
      Output:  [1, 1, 2, 3, 4, 4, 5, 6]
    strong_signals:
      - Asks about empty lists, duplicates and how big k is compared with the total length n.
      - Uses a min heap holding the next item from each list, popping the smallest and pushing the next item from its list.
      - Time O(n log k), space O(k) for the heap besides the output.
      - Compares with merging lists in pairs, also O(n log k), and merging one at a time, which is O(n * k).
    follow_ups:
      - Why is merging the lists one at a time slower?
      - What if each list is a file too big to fit in memory?
      - What if the lists live on different machines?

  - id: time-based-store
    title: Key-value store with history
    levels: [mid, senior, staff]
    prompt: |
      Build a store with two methods.
        set(key, value, timestamp) saves a value for the key at that time.
        get(key, timestamp) returns the value from the latest set for the key
        at or before timestamp, or "" if there is none.
      For the same key, set is always called with increasing timestamps.

      Example:
        set("color", "red", 1)
        set("color", "blue", 4)
        get("color", 3)  ->  "red"
        get("color", 4)  ->  "blue"
        get("color", 0)  ->  ""
    strong_signals:
      - Asks what get returns for a key that was never set.
      - Stores a list of (timestamp, value) pairs for each key, which stays sorted because timestamps increase.
      - Uses binary search in get to find the last timestamp at or before the one asked for.
      - set O(1), get O(log m) where m is the number of values for that key, space O(number of sets).
    follow_ups:
      - What changes if set can be called with timestamps out of order?
      - How would you drop history older than a week to save memory?
      - How would you make it safe for many threads to read while one writes?

  - id: meeting-rooms
    title: Fewest meeting rooms
    levels: [mid, senior, staff]
    prompt: |
      Given a list of meetings as [start, end], return the fewest rooms needed
      so that no two meetings are in the same room at the same time.

      Example: [[0, 30], [5, 10], [15, 20]]  ->  2
    strong_signals:
      - Asks whether a meeting that ends at 10 and one that starts at 10 can use the same room.
      - Sorts by start time and keeps a min heap of end times, reusing a room when the earliest end is not after the next start.
      - Or sorts the starts and ends separately and sweeps through both, counting the rooms in use.
      - Time O(n log n), space O(n).
    follow_ups:
      - How would you also say which room each meeting goes in?
      - How would you find the busiest time of the day?
      - What if meetings are booked and cancelled all day long while people are looking?

  - id: median-stream
    title: Median of a stream
    levels: [senior, staff]
    prompt: |
      Numbers arrive one at a time. Build a class with add(num), which stores a number,
      and median(), which returns the median of every number added so far.

      Example: add(1), add(2), median() -> 1.5, add(3), median() -> 2
    strong_signals:
      - Asks how often each method is called and what median returns before any number is added.
      - Keeps two heaps, a max heap for the smaller half and a min heap for the larger half.
      - Rebalances so the sizes differ by at most one, and reads the median from the tops.
      - add O(log n), median O(1), space O(n).
    follow_ups:
      - What if every number is between 0 and 100?
      - How would you find the median of only the last 1,000 numbers?
      - How would you estimate the median of numbers spread over many machines?

  - id: word-ladder
    title: Word ladder
    levels: [senior, staff]
    prompt: |
      Given a start word, an end word and a list of allowed words, return the number of
      words in the shortest chain from start to end. Each step changes exactly one letter,
      and every word after the start must be in the list. Return 0 if there is no chain.

      Example: start = "hit", end = "cog"
               words = ["hot", "dot", "dog", "lot", "log", "cog"]
      Output:  5  (hit -> hot -> dot -> dog -> cog)
    strong_signals:
      - Recognises it as a shortest path in an unweighted graph, so BFS.
      - Finds neighbours by changing one letter at a time or with wildcard patterns such as h*t, not by comparing every pair of words.
      - Marks words as visited when they are added to the queue.
      - Time about O(n * L^2) for n words of length L, since each word has L patterns that each take O(L) to build.
    follow_ups:
      - How would you return the chain itself, not only its length?
      - How would searching from both ends at once help?
      - What if the word list has millions of words?
