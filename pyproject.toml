[project]
name = "onsite"
version = "0.1.0"
description = "An AI mock interviewer that runs a real onsite loop and grades you like a hiring committee."
readme = "README.md"
license = "MIT"
authors = [{ name = "habul17", email = "abulhassanca.dev@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
    "miniaudio>=1.71",
    "numpy>=2.0",
]

[project.scripts]
onsite = "onsite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
