[project]
name = "onsite"
version = "0.1.0"
description = "An AI mock interviewer that runs a real onsite loop and grades you like a hiring committee."
readme = "README.md"
license = "MIT"
authors = [{ name = "habul17", email = "abulhassanca.dev@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
